model:
  class_path: src.model.clip.svl.SynoVideoLearner
  init_args:
    num_frames: 10
    architecture: ViT-L/14
    ksize_s: 5
    ksize_t: 5
    s_k_attr: 'k' 
    s_v_attr: 'emb' 
    t_attrs: ["q","k","v"]
    num_synos: 4
    op_mode: ["S", "T"]
    is_focal_loss: true
    cls_weight: 10.0
    label_weights: [1, 1]

trainer:
  accumulate_grad_batches: 1