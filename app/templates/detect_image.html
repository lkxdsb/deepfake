{% extends "base.html" %}
{% block title %}图片检测{% endblock %}
{% block content %}
<div class="card">
  <h2>图片检测</h2>
  <p class="small-note">支持格式：jpg / jpeg / png，支持单张和批量上传</p>
  <form id="image-form">
    <label class="field-label" for="image-batch-name">任务名（批量时建议填写）</label>
    <input class="text-input" type="text" id="image-batch-name" placeholder="例如：答辩图片样例集">
    <label class="field-label" for="image-file">选择文件</label>
    <input type="file" id="image-file" accept=".jpg,.jpeg,.png" multiple required>
    <button type="submit">开始检测</button>
  </form>
  <p id="status" class="small-note"></p>
</div>

<script>
document.getElementById('image-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = document.getElementById('status');
  const fileInput = document.getElementById('image-file');
  const batchNameInput = document.getElementById('image-batch-name');
  if (!fileInput.files.length) {
    status.textContent = '请先选择图片文件';
    return;
  }

  const fd = new FormData();
  for (const file of fileInput.files) {
    fd.append('files', file);
  }
  if (batchNameInput.value.trim()) {
    fd.append('batch_name', batchNameInput.value.trim());
  }
  status.className = 'small-note';
  status.textContent = `检测中，共 ${fileInput.files.length} 个文件，请稍候...`;

  try {
    const res = await fetch('/api/detect/image', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok || data.code !== 0) {
      throw new Error(data.message || 'detect failed');
    }
    const targetTaskId = data.data.batch_task_id || data.data.task_id;
    window.location.href = `/results/${targetTaskId}`;
  } catch (err) {
    status.textContent = `检测失败：${err.message}`;
    status.className = 'error';
  }
});
</script>
{% endblock %}
