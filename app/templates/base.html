<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="多模态深度伪造检测平台，支持图片、视频与音频一体化智能鉴伪。">
  <title>{% block title %}多模态深度伪造检测平台{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <script src="/static/chat_markdown.js?v={{ asset_version }}" defer></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}page-default{% endblock %}">
  <div class="site-shell">
    <header class="site-header">
      <div class="site-header__inner">
        <a href="/" class="brand">
          <span class="brand-mark"></span>
          <span class="brand-copy">
            <strong>多模态深度伪造检测平台</strong>
            <span>Deepfake Forensics Workspace</span>
          </span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a class="{% if request.url.path == '/' %}is-active{% endif %}" href="/">首页</a>
          <a class="{% if request.url.path.startswith('/education') %}is-active{% endif %}" href="/education">科普频道</a>
          <a class="{% if request.url.path.startswith('/quiz') %}is-active{% endif %}" href="/quiz">反诈闯关</a>
          <a class="{% if request.url.path.startswith('/detect/image') %}is-active{% endif %}" href="/detect/image">图片检测</a>
          <a class="{% if request.url.path.startswith('/detect/video') %}is-active{% endif %}" href="/detect/video">视频检测</a>
          <a class="{% if request.url.path.startswith('/detect/audio') %}is-active{% endif %}" href="/detect/audio">音频检测</a>
          <a class="{% if request.url.path.startswith('/chat') %}is-active{% endif %}" href="/chat">AI问答</a>
          <a class="{% if request.url.path.startswith('/history') %}is-active{% endif %}" href="/history">历史记录</a>
        </nav>
        <div class="site-badge">Competition Edition</div>
      </div>
    </header>
    <main class="site-main {% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>多模态深度伪造检测平台</p>
        <p>视觉素材本地托管，来源含 Pexels 与仓库内置图示；字体来源为 Google Fonts 本地托管版本。</p>
      </div>
    </footer>
  </div>
</body>
</html>
